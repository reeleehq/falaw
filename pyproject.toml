[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "falaw"
version = "0.0.59"
description = "Agent-friendly Python facade over fal.ai for generating and managing AI media (images, video, audio)."
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    # >=0.0.31 for the widened ProvenanceRef union (lacing#14/D5): the
    # executor stamps upstream artifact asset_ids into was_derived_from,
    # which the pre-D5 list[UUID] type refuses.
    # >=0.0.46 for the contained ArtifactStore.iter_blobs/delete_blob that
    # falaw.prune lists and deletes blobs through (falaw#66, lacing#55).
    "lacing>=0.0.46",
    # ocracy.kit: the fleet's shared credential chain (using_fal_credentials binds
    # the kit's "fal" provider). Stdlib-only; ocracy itself has no dependencies.
    "ocracy>=0.1.12",
    # >=0.3.37 for `Files(..., delete_func=)`: the content store deletes
    # blobs from disk instead of moving them to the OS trash (falaw#66).
    "dol>=0.3.37",
    # falaw.backends' execution-backend registry (falaw#15) — a second
    # backend (ComfyUI etc.) dispatches here, not through a hand-rolled if/elif.
    "xdol>=0.1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["falaw"]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/falaw"
Repository = "https://github.com/thorwhalen/falaw"
Documentation = "https://thorwhalen.github.io/falaw"

[project.optional-dependencies]
# The fal.ai network client. Building, pricing, hashing and caching plans needs
# none of it; the first real call (`call_fal`, the refresh/pricing fetchers)
# raises FalClientNotInstalled naming this extra. httpx rides in with it.
fal = [
    "fal-client>=0.5",
]
dev = [
    # the suite exercises execution against a stubbed or real fal_client.
    "falaw[fal]",
    # falaw.schema_export (repo tooling: the TS twin's contract) and its test.
    "pydantic>=2.12",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
mcp = [
    "fastmcp>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "falaw"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.install]
# CI installs the bare package; the suite stubs or exercises fal_client, which is
# the optional `fal` extra.
extras = ["fal"]

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
